services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb

    # Пробрасываем порт из контейнера наружу:
    # внутри контейнера InfluxDB слушает 8086
    ports:
      - "8086:8086"

    # Том (volume) нужен, чтобы данные не пропали при перезапуске
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

    # Подгружаем переменные из infra/.env
    env_file:
      - .env

    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - influxdb

    volumes:
      - grafana_data:/var/lib/grafana

      # Provisioning — автонастройка datasources/дашбордов
      - ./grafana/provisioning:/etc/grafana/provisioning

    env_file:
      - .env

    restart: unless-stopped

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data: